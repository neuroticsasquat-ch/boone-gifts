services:
  boone-gifts-backend:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      # Hide any host .venv (an IDE's, built for macOS) from the container. The
      # toolchain lives in /opt/venv (UV_PROJECT_ENVIRONMENT in the Dockerfile).
      - /app/.venv
    # Traefik, Mailpit and the external `proxy` network come from the shared
    # tbc-localdev-infra stack (`task infra:up`). The database is SQLite under
    # ./data (APP_DATABASE_URL in .env), so no database server is involved. Mail
    # goes to Mailpit at tbc_mailpit:1025 when .env sets APP_EMAIL_PROVIDER=smtp.
    #
    # No published port: Traefik is the only route in. The router keeps its
    # boone-gifts-api name, matching the hostname.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.boone-gifts-api.rule=Host(`boone-gifts-api.localhost`)"
      - "traefik.http.routers.boone-gifts-api.entrypoints=websecure"
      - "traefik.http.routers.boone-gifts-api.tls=true"
      - "traefik.http.services.boone-gifts-api.loadbalancer.server.port=8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - proxy

  # The SPA, from frontend/. The browser calls the API directly at VITE_API_URL
  # (frontend/.env, https://boone-gifts-api.localhost), so nothing here reaches the
  # backend container. No published port: Traefik is the only route in.
  boone-gifts-frontend:
    build:
      context: frontend
      target: dev
    volumes:
      - ./frontend:/app
      # The container's own node_modules (Linux binaries), not the host's.
      - node_modules:/app/node_modules
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.boone-gifts-web.rule=Host(`boone-gifts.localhost`)"
      - "traefik.http.routers.boone-gifts-web.entrypoints=websecure"
      - "traefik.http.routers.boone-gifts-web.tls=true"
      - "traefik.http.services.boone-gifts-web.loadbalancer.server.port=5173"
    # The SPA has no health route; Vite answering `/` is the readiness signal.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - proxy

volumes:
  node_modules:

networks:
  proxy:
    external: true
